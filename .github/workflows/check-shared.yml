name: Plugin checks

on:
  push:
  pull_request:

jobs:
  check-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-shared.sh

  lf-checkout:
    # Git for Windows defaults to core.autocrlf=true; plugin files must still check out with LF.
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: No file checks out with CRLF
        shell: bash
        run: |
          crlf=$(git ls-files --eol | grep 'w/crlf' || true)
          if [ -n "$crlf" ]; then
            echo "$crlf"
            echo "These files check out with CRLF; fix .gitattributes." >&2
            exit 1
          fi
